<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">

  <title>SST Microwelding — Documentation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #202124;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 42px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 32px;
      font-weight: 600;
    }

    header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 16px;
    }

    main {
      max-width: 850px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .intro p {
      margin: 0;
      color: #6b7280;
    }

    .product {
      background: white;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
    }

    .product h3 {
      margin: 0 0 20px;
      font-size: 23px;
    }

    .languages {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .language {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: #eef0f3;
      color: #202124;
      padding: 12px 16px;
      border-radius: 9px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .language:hover {
      background: #dfe3e8;
      transform: translateY(-1px);
    }

    .flag {
      width: 25px;
      height: 17px;
      display: block;
      border-radius: 2px;
      box-shadow: 0 0 2px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      color: #8a8f98;
      font-size: 13px;
      padding: 15px 20px 35px;
    }

    @media (max-width: 600px) {
      header {
        padding: 32px 15px;
      }

      header h1 {
        font-size: 27px;
      }

      main {
        margin: 30px auto;
      }

      .product {
        padding: 22px;
      }

      .languages {
        flex-direction: column;
      }

      .language {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SST Microwelding</h1>
  <p>Documentation technique</p>
</header>

<main>

  <div class="intro">
    <h2>Notices et documents</h2>
    <p>Sélectionnez votre produit et la langue souhaitée.</p>
  </div>


  <!-- LASE ONE -->
  <section class="product">
    <h3>Lase One</h3>

    <div class="languages">

      <!-- Français -->
      <a class="language" href="Lase-One-fr.pdf" target="_blank">
        <svg class="flag" viewBox="0 0 30 20">
          <rect width="10" height="20" fill="#0055A4"/>
          <rect x="10" width="10" height="20" fill="#FFFFFF"/>
          <rect x="20" width="10" height="20" fill="#EF4135"/>
        </svg>
        Français
      </a>

      <!-- English -->
      <a class="language" href="Lase-One-en.pdf" target="_blank">
        <svg class="flag" viewBox="0 0 60 40">
          <rect width="60" height="40" fill="#012169"/>
          <path d="M0 0 L60 40 M60 0 L0 40" stroke="#FFFFFF" stroke-width="8"/>
          <path d="M0 0 L60 40 M60 0 L0 40" stroke="#C8102E" stroke-width="4"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#FFFFFF" stroke-width="13"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#C8102E" stroke-width="7"/>
        </svg>
        English
      </a>

      <!-- Italiano -->
      <a class="language" href="Lase-One-it.pdf" target="_blank">
        <svg class="flag" viewBox="0 0 30 20">
          <rect width="10" height="20" fill="#009246"/>
          <rect x="10" width="10" height="20" fill="#FFFFFF"/>
          <rect x="20" width="10" height="20" fill="#CE2B37"/>
        </svg>
        Italiano
      </a>

    </div>
  </section>


  <!-- WS -->
  <section class="product">
    <h3>WS</h3>

    <div class="languages">

      <!-- Français / English -->
      <a class="language" href="WS-fr-en.pdf" target="_blank">

        <svg class="flag" viewBox="0 0 30 20">
          <rect width="10" height="20" fill="#0055A4"/>
          <rect x="10" width="10" height="20" fill="#FFFFFF"/>
          <rect x="20" width="10" height="20" fill="#EF4135"/>
        </svg>

        <svg class="flag" viewBox="0 0 60 40">
          <rect width="60" height="40" fill="#012169"/>

          <path d="M0 0 L60 40 M60 0 L0 40" stroke="#C8102E" stroke-width="4"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#FFFFFF" stroke-width="13"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#C8102E" stroke-width="7"/>
        </svg>

        Français / English
      </a>

      <!-- WS Technique Français -->
      <a class="language" href="WS-technique-fr.pdf" target="_blank">

        <svg class="flag" viewBox="0 0 30 20">
          <rect width="10" height="20" fill="#0055A4"/>
          <rect x="10" width="10" height="20" fill="#FFFFFF"/>
          <rect x="20" width="10" height="20" fill="#EF4135"/>
        </svg>

        WS Technique Français
      </a>

      <!-- WS Technical English -->
      <a class="language" href="WS-technocal-en.pdf" target="_blank">

        <svg class="flag" viewBox="0 0 60 40">
          <rect width="60" height="40" fill="#012169"/>
          <path d="M0 0 L60 40 M60 0 L0 40" stroke="#FFFFFF" stroke-width="8"/>
          <path d="M0 0 L60 40 M60 0 L0 40" stroke="#C8102E" stroke-width="4"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#FFFFFF" stroke-width="13"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#C8102E" stroke-width="7"/>
        </svg>

        WS Technical English
      </a>

      <!-- Reset WS -->
      <a class="language" href="Reset%20WS.pdf" target="_blank">

        <svg class="flag" viewBox="0 0 30 20">
          <rect width="30" height="20" fill="#eef0f3"/>
          <path d="M8 10 A7 7 0 1 0 10 5" fill="none" stroke="#202124" stroke-width="2"/>
          <path d="M8 3 L8 7 L12 7" fill="none" stroke="#202124" stroke-width="2"/>
        </svg>

        Reset WS
      </a>

    </div>
  </section>


  <!-- CART -->
  <section class="product">
    <h3>CART</h3>

    <div class="languages">

      <!-- Français / English -->
      <a class="language" href="Cart-fr-en.pdf" target="_blank">

        <svg class="flag" viewBox="0 0 30 20">
          <rect width="10" height="20" fill="#0055A4"/>
          <rect x="10" width="10" height="20" fill="#FFFFFF"/>
          <rect x="20" width="10" height="20" fill="#EF4135"/>
        </svg>

        <svg class="flag" viewBox="0 0 60 40">
          <rect width="60" height="40" fill="#012169"/>
          <path d="M0 0 L60 40 M60 0 L0 40" stroke="#FFFFFF" stroke-width="8"/>
          <path d="M0 0 L60 40 M60 0 L0 40" stroke="#C8102E" stroke-width="4"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#FFFFFF" stroke-width="13"/>
          <path d="M30 0 V40 M0 20 H60" stroke="#C8102E" stroke-width="7"/>
        </svg>

        Français / English
      </a>

      <!-- CART DB -->
      <a class="language" href="CART-DB.pdf" target="_blank">

        <svg class="flag" viewBox="0 0 30 20">
          <rect width="30" height="20" fill="#eef0f3"/>
          <rect x="6" y="4" width="18" height="12" rx="2" fill="#202124"/>
          <path d="M9 8 H21 M9 11 H21 M9 14 H17" stroke="#FFFFFF" stroke-width="1.5"/>
        </svg>

        CART DB
      </a>

    </div>
  </section>

</main>

<footer>
  © SST Microwelding — Documentation
</footer>

</body>
</html>
